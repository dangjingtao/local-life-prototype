name: Experimental OpenCode PR Review

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: experimental-opencode-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check OpenCode key
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "::error title=Missing OPENCODE_API_KEY::Add repository secret OPENCODE_API_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Load reviewer from dev
        shell: bash
        run: git show "origin/${{ github.base_ref }}:scripts/opencode-pr-review.mjs" > "$RUNNER_TEMP/opencode-pr-review.mjs"

      - name: Run read-only OpenCode review
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_REVIEW_MODEL: ${{ vars.OPENCODE_REVIEW_MODEL || 'opencode/mimo-v2.5-free' }}
          OPENCODE_PERMISSION: '{"edit":"deny","bash":"deny","task":"deny","webfetch":"deny","websearch":"deny"}'
        run: node "$RUNNER_TEMP/opencode-pr-review.mjs"

      - name: Upload review result
        uses: actions/upload-artifact@v4
        with:
          name: opencode-pr-review-${{ github.event.pull_request.number }}
          path: ai-review.md
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: review
    if: ${{ needs.review.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Download review result
        uses: actions/download-artifact@v4
        with:
          name: opencode-pr-review-${{ github.event.pull_request.number }}
          path: review-output

      - name: Publish or update PR review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          BODY="$(cat review-output/ai-review.md)"
          COMMENT_ID="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --paginate --jq '.[] | select(.body | contains("<!-- local-ai-review:v1 -->")) | .id' | tail -n 1)"

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$BODY" >/dev/null
            echo "Updated OpenCode review comment $COMMENT_ID on PR #$PR_NUMBER."
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY" >/dev/null
            echo "Created OpenCode review comment on PR #$PR_NUMBER."
          fi
