name: Deploy GitHub Pages

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - uses: actions/configure-pages@v5
      - name: Build Pages artifact
        shell: bash
        run: |
          mkdir -p pages
          printf '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Prototype</title><h1>Prototype</h1>' > pages/index.html

          if [ -d apps/mobile ]; then
            VITE_BASE_PATH="/${{ github.event.repository.name }}/mobile/" npm run build:mobile
            cp -R apps/mobile/dist pages/mobile
            printf '<p><a href="./mobile/">Mobile</a></p>' >> pages/index.html
          fi

          if [ -d apps/pc ]; then
            VITE_BASE_PATH="/${{ github.event.repository.name }}/pc/" npm run build:pc
            cp -R apps/pc/dist pages/pc
            printf '<p><a href="./pc/">PC</a></p>' >> pages/index.html
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy production Pages site
        id: deployment
        uses: actions/deploy-pages@v4
