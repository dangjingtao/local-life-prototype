name: One-time lockfile project name fix

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-time-fix-lockfile-name.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 1

      - name: Replace root lockfile project name only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (lock.name !== 'comuilty' || lock.packages?.['']?.name !== 'comuilty') {
            throw new Error('Expected exactly the legacy root project name before migration.');
          }
          lock.name = 'local-life';
          lock.packages[''].name = 'local-life';
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          NODE

          if grep -Fq 'comuilty' package-lock.json; then
            echo 'Legacy typo still exists in package-lock.json.'
            exit 1
          fi

          changed="$(git diff --numstat -- package-lock.json)"
          echo "$changed"
          if [ "$changed" != $'2\t2\tpackage-lock.json' ]; then
            echo 'Unexpected lockfile churn; refusing to commit.'
            git diff -- package-lock.json
            exit 1
          fi

      - name: Commit corrected lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: align lockfile project name'
          git push origin HEAD:dev
