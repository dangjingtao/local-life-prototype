name: Deploy Cloudflare Pages

on:
  push:
    branches: [dev, prod]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    strategy:
      fail-fast: false
      matrix:
        app: [mobile, pc]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'prod' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve deployment target
        id: target
        env:
          APP: ${{ matrix.app }}
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs');
          const config = require('./prototype.config.json');
          const app = process.env.APP;
          const exists = fs.existsSync(`apps/${app}/package.json`);
          const enabled = Boolean(exists && config.targets?.[app] && config.deployment?.cloudflare?.enabled);
          const project = config.deployment?.cloudflare?.projects?.[app] || '';
          const legacy = project === `local-life-${app}` ? `comuilty-${app}` : '';
          console.log(`enabled=${enabled}`);
          console.log(`project=${project}`);
          console.log(`legacy=${legacy}`);
          NODE

      - name: Check Cloudflare credentials
        if: steps.target.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment is enabled but CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are missing."
            echo "Run: mira setup cicd"
            exit 1
          fi

      - name: Migrate legacy Cloudflare Pages project name
        if: steps.target.outputs.enabled == 'true' && steps.target.outputs.legacy != ''
        env:
          PROJECT: ${{ steps.target.outputs.project }}
          LEGACY_PROJECT: ${{ steps.target.outputs.legacy }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects"
          AUTH=(--header "Authorization: Bearer $CF_API_TOKEN" --header "Content-Type: application/json")

          new_status="$(curl --silent --show-error --output "$RUNNER_TEMP/cf-new.json" --write-out '%{http_code}' "${AUTH[@]}" "$API/$PROJECT")"
          if [ "$new_status" = "200" ]; then
            echo "Cloudflare Pages project $PROJECT already exists; no rename needed."
            exit 0
          fi
          if [ "$new_status" != "404" ]; then
            cat "$RUNNER_TEMP/cf-new.json"
            echo "Unexpected Cloudflare status while checking $PROJECT: $new_status"
            exit 1
          fi

          legacy_status="$(curl --silent --show-error --output "$RUNNER_TEMP/cf-legacy.json" --write-out '%{http_code}' "${AUTH[@]}" "$API/$LEGACY_PROJECT")"
          if [ "$legacy_status" = "200" ]; then
            payload="$(jq -nc --arg name "$PROJECT" '{name:$name,production_branch:"prod"}')"
            curl --fail-with-body --silent --show-error --request PATCH "${AUTH[@]}" --data "$payload" "$API/$LEGACY_PROJECT" > "$RUNNER_TEMP/cf-renamed.json"
            jq -e --arg name "$PROJECT" '.success == true and .result.name == $name' "$RUNNER_TEMP/cf-renamed.json" >/dev/null
            echo "Renamed Cloudflare Pages project $LEGACY_PROJECT -> $PROJECT."
            exit 0
          fi
          if [ "$legacy_status" != "404" ]; then
            cat "$RUNNER_TEMP/cf-legacy.json"
            echo "Unexpected Cloudflare status while checking $LEGACY_PROJECT: $legacy_status"
            exit 1
          fi

          payload="$(jq -nc --arg name "$PROJECT" '{name:$name,production_branch:"prod"}')"
          curl --fail-with-body --silent --show-error --request POST "${AUTH[@]}" --data "$payload" "$API" > "$RUNNER_TEMP/cf-created.json"
          jq -e --arg name "$PROJECT" '.success == true and .result.name == $name' "$RUNNER_TEMP/cf-created.json" >/dev/null
          echo "Created Cloudflare Pages project $PROJECT because neither the corrected nor legacy project existed."

      - uses: actions/setup-node@v6
        if: steps.target.outputs.enabled == 'true'
        with:
          node-version: 24

      - run: npm install
        if: steps.target.outputs.enabled == 'true'

      - name: Build ${{ matrix.app }}
        if: steps.target.outputs.enabled == 'true'
        run: npm run build --workspace @prototype/${{ matrix.app }}

      - name: Deploy ${{ matrix.app }}
        if: steps.target.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy apps/${{ matrix.app }}/dist --project-name=${{ steps.target.outputs.project }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}
